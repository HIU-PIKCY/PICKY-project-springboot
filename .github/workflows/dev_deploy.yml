name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]

jobs:

  # ======== CI: 빌드 및 Docker 이미지 push ========

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/picky-docker:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

    # ======== CD: EC2에 배포 ========

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Upload .env to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key && chmod 600 private_key
          scp -i private_key -o StrictHostKeyChecking=no .env ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/.env

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /home/ubuntu/app/deploy.sh ${{ secrets.DOCKERHUB_USERNAME }}/picky-docker ${{ github.sha }}
