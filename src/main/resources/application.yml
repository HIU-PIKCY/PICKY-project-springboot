spring:
  profiles:
    active: dev # 배포용은 prod, 로컬용은 dev 로 바꿔 사용
  application:
    name: backend
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        default_batch_fetch_size: 1000

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-time: 1800000
  refresh-token-expire-time: 604800000
firebase:
  service-account-key-path: firebase-adminsdk.json